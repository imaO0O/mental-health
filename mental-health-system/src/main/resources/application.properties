# Приложение
spring.application.name=mental-health-system

# Сервер
server.port=8080

# База данных PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/mental_health_db
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Инициализация БД (схема, триггеры, хранимые процедуры) и справочные данные
# Установлен в always — schema.sql и data.sql выполняются при каждом старте
# (DDL идемпотентен: CREATE ... IF NOT EXISTS / OR REPLACE).
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Логирование
logging.level.root=INFO
logging.level.ru.rrtu.mental_health_system=DEBUG
logging.level.org.springframework.security=DEBUG
